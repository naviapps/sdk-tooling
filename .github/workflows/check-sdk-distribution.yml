name: SDK distribution checks
run-name: ${{ inputs.sdk }} distribution at ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: Repository name in this organization
        type: string
        required: true
      revision:
        description: Full SDK commit SHA on main
        type: string
        required: true
      windows-on-arm:
        description: Also run the combined win-x64 NuGet package on Windows on Arm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-distribution-${{ inputs.sdk }}-${{ inputs.revision }}
  cancel-in-progress: false

env:
  SDK_NAME: ${{ inputs.sdk }}
  SDK_REVISION: ${{ inputs.revision }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  MSBUILDDISABLENODEREUSE: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  plan:
    name: Read the distribution plan
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      platforms: ${{ steps.plan.outputs.platforms }}
      tooling-revision: ${{ steps.plan.outputs.revision }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      xcframeworks: ${{ steps.plan.outputs.xcframeworks }}
      nuget: ${{ steps.plan.outputs.nuget }}
    steps:
      - name: Check out the dispatcher
        uses: actions/checkout@v6.1.0
        with:
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Validate the requested source identity
        id: source
        run: python -I -B dispatcher/ci/check_distribution.py identity "$SDK_NAME" "$SDK_REVISION"
      - name: Check out the candidate SDK
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ inputs.revision }}
          path: sdk
          fetch-depth: 0
          sparse-checkout: |
            /sdk-distribution.toml
            /mise.toml
            /global.json
            /native.toml
            /distribution/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read the verified SDK plan
        id: plan
        working-directory: sdk
        env:
          WINDOWS_ON_ARM: ${{ inputs.windows-on-arm }}
        run: |
          options=()
          if [[ "$WINDOWS_ON_ARM" == true ]]; then
            options+=(--windows-on-arm)
          fi
          python -I -B ../dispatcher/ci/check_distribution.py plan "$SDK_NAME" "$SDK_REVISION" "${options[@]}"

  distribution:
    name: Distribution
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    uses: ./.github/workflows/check-sdk-distribution-platform.yml
    with:
      sdk: ${{ inputs.sdk }}
      repository: ${{ needs.plan.outputs.repository }}
      revision: ${{ inputs.revision }}
      tooling-revision: ${{ needs.plan.outputs.tooling-revision }}
      platform: ${{ matrix.platform }}
      dotnet: ${{ matrix.platform == 'windows' && needs.plan.outputs.dotnet == 'true' }}
      xcframeworks: ${{ matrix.platform == 'macos' && needs.plan.outputs.xcframeworks == 'true' }}
      combined-nuget: ${{ needs.plan.outputs.nuget == 'true' }}

  combined:
    name: Distribution and combined NuGet
    needs: [plan, distribution]
    if: needs.plan.outputs.nuget == 'true'
    uses: ./.github/workflows/check-sdk-distribution-platform.yml
    with:
      sdk: ${{ inputs.sdk }}
      repository: ${{ needs.plan.outputs.repository }}
      revision: ${{ inputs.revision }}
      tooling-revision: ${{ needs.plan.outputs.tooling-revision }}
      platform: macos
      dotnet: true
      xcframeworks: true
      combined-nuget: true
      windows-native-id: ${{ needs.distribution.outputs.windows-native-id }}

  nuget-windows:
    name: ${{ matrix.architecture == 'arm64' && 'NuGet on Windows on Arm' || 'NuGet on Windows x64' }}
    needs: [plan, combined]
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.windows-on-arm && '["x64","arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: sdk
    steps:
      - name: Check out the dispatcher
        uses: actions/checkout@v6.1.0
        with:
          path: dispatcher
          persist-credentials: false
      - name: Check out the candidate SDK
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ needs.plan.outputs.repository }}
          ref: ${{ inputs.revision }}
          path: sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the SDK's pinned tooling
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.plan.outputs.tooling-revision }}
          path: sdk-tooling
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          architecture: ${{ matrix.architecture }}
      - name: Install pinned x64 .NET
        uses: actions/setup-dotnet@v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: sdk/global.json
          architecture: x64
          skip-lts-prepass: true
      - name: Require the macOS-tested NuGet package
        env:
          NUGET_ID: ${{ needs.combined.outputs.nuget-id }}
        run: test -n "$NUGET_ID"
      - name: Download the macOS-tested NuGet package
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.combined.outputs.nuget-id }}
          path: ${{ runner.temp }}/sdk-nuget
      - name: Check the digest and run the independent x64 consumer
        env:
          NUGET_SHA256: ${{ needs.combined.outputs.nuget-sha256 }}
          WINDOWS_HOST: ${{ matrix.architecture }}
        run: |
          python -I -B ../dispatcher/ci/check_distribution.py nuget-consume "$SDK_NAME" "$SDK_REVISION" \
            --tooling ../sdk-tooling --nuget-artifact "$RUNNER_TEMP/sdk-nuget" \
            --nuget-sha256 "$NUGET_SHA256" --windows-host "$WINDOWS_HOST"
