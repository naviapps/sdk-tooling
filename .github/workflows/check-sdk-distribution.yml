name: SDK distribution checks
run-name: ${{ inputs.sdk }} distribution at ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: Repository name in this organization
        type: string
        required: true
      revision:
        description: Full SDK commit SHA on main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-distribution-${{ inputs.sdk }}-${{ inputs.revision }}
  cancel-in-progress: false

env:
  SDK_NAME: ${{ inputs.sdk }}
  SDK_REVISION: ${{ inputs.revision }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  MSBUILDDISABLENODEREUSE: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  distribution:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS distribution
            platform: macos
            runner: xcode-27
            architecture: arm64
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
            timeout: 45
          - name: Windows x64 distribution
            platform: windows
            runner: windows-2025
            architecture: x64
            developer-dir: ""
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      SDK_PLATFORM: ${{ matrix.platform }}
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the dispatcher
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.1"
          architecture: ${{ matrix.architecture }}
      - name: Validate the requested source identity
        id: source
        run: python -I -B dispatcher/ci/check_distribution.py identity "$SDK_NAME" "$SDK_REVISION"
      - name: Check out the candidate SDK
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ inputs.revision }}
          path: sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the SDK revision and read its distribution plan
        id: plan
        working-directory: sdk
        run: python -I -B ../dispatcher/ci/check_distribution.py pin "$SDK_NAME" "$SDK_REVISION" --platform "$SDK_PLATFORM"
      - name: Check out the SDK's pinned tooling
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ steps.plan.outputs.revision }}
          path: sdk-tooling
          persist-credentials: false
      - name: Install mise
        if: steps.plan.outputs.enabled == 'true' && matrix.platform == 'macos'
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          working_directory: dispatcher
          install: false
          cache: false
          add_shims_to_path: false
      - name: Install x64 .NET
        if: steps.plan.outputs.dotnet != ''
        uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.plan.outputs.dotnet }}
          architecture: x64
      - name: Run SDK distribution checks
        if: steps.plan.outputs.enabled == 'true'
        working-directory: sdk
        env:
          SDK_XCFRAMEWORK_OUTPUT: ${{ steps.plan.outputs.xcframeworks == 'true' && format('{0}/sdk-xcframeworks', runner.temp) || '' }}
        run: |
          options=()
          if [[ -n "$SDK_XCFRAMEWORK_OUTPUT" ]]; then
            options+=(--xcframework-output "$SDK_XCFRAMEWORK_OUTPUT")
          fi
          python -I -B ../dispatcher/ci/check_distribution.py "$SDK_PLATFORM" "$SDK_NAME" "$SDK_REVISION" \
            --tooling ../sdk-tooling "${options[@]}"
      - name: Upload verified XCFramework archives
        if: steps.plan.outputs.xcframeworks == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.sdk }}-xcframeworks-${{ inputs.revision }}
          path: ${{ runner.temp }}/sdk-xcframeworks
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
