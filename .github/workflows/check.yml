name: SDK tooling checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-tooling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: windows-2025
            architecture: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.1"
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
          architecture: ${{ matrix.architecture }}
      - uses: jdx/mise-action@v5.3.0
        if: runner.os == 'macOS'
        env:
          MISE_DISABLE_TOOLS: python,rust
        with:
          version: "2026.11.12"
          cache: false
          install_args: ruff dprint jactionlint shellcheck
          add_shims_to_path: false
          export_path: false
          env: false
      - name: Check owned source and workflow
        if: runner.os == 'macOS'
        env:
          MISE_DISABLE_TOOLS: python,rust
          MISE_AUTO_INSTALL: "0"
        shell: bash
        run: mise exec -- python -B -m sdk_tooling quality check --language python --language shell --language data
      - name: Select pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Verify SDK mechanisms and clean NuGet consumers
        env:
          SDK_TOOLING_TEST_DOTNET: "1"
        shell: bash
        run: python -B -m unittest discover -s tests -v
      - name: Check Rust tooling
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          if [[ "$RUNNER_OS" == macOS ]]; then
            cargo fmt --all -- --check
          fi
          cargo fetch --locked --target "$target"
          cargo clippy --locked --offline --workspace --target "$target" --all-targets -- -D warnings
          cargo test --locked --offline --workspace --target "$target"
