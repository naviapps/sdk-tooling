name: Swift SDK checks
on:
  workflow_call:
    inputs:
      source-macos:
        description: macOS version that also runs the SDK's source checks.
        type: string
        default: "27"
      source-target:
        description: Make target for the SDK's source checks and any additional preparation.
        type: string
        default: check-source
permissions:
  contents: read
jobs:
  swift:
    name: macOS ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "26"
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
          - macos: "27"
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.macos == inputs.source-macos && 65 || 20 }}
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        id: swift-toolchain
        env:
          SOURCE_MACOS: ${{ inputs.source-macos }}
        run: |
          case "$SOURCE_MACOS" in
            26|27) ;;
            *) echo "source-macos must be 26 or 27" >&2; exit 1 ;;
          esac
          sw_vers
          xcrun swift --version
      - name: Test Swift SDK
        run: make test
      - name: Install SDK tools
        if: ${{ !cancelled() && steps.swift-toolchain.outcome == 'success' && (success() || matrix.macos == inputs.source-macos) }}
        id: tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          install_args: ${{ matrix.macos != inputs.source-macos && 'uv python' || '' }}
          add_shims_to_path: false
      - name: Test standalone Swift consumer
        run: mise exec -- make test-consumer
      - name: Check SDK source and bindings
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && matrix.macos == inputs.source-macos }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          SOURCE_TARGET: ${{ inputs.source-target }}
        run: |
          if [ -f Cargo.toml ]; then
            mise exec -- cargo fetch --locked
          fi
          mise exec -- make -- "$SOURCE_TARGET"
