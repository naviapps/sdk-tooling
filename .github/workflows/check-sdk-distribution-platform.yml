name: SDK platform distribution checks

on:
  workflow_call:
    inputs:
      sdk:
        type: string
        required: true
      repository:
        type: string
        required: true
      revision:
        type: string
        required: true
      tooling-revision:
        type: string
        required: true
      platform:
        type: string
        required: true
      dotnet:
        type: boolean
        default: false
      xcframeworks:
        type: boolean
        default: false
      combined-nuget:
        type: boolean
        default: false
      windows-native-id:
        type: string
    outputs:
      windows-native-id:
        value: ${{ jobs.check.outputs.windows-native-id }}
      nuget-id:
        value: ${{ jobs.check.outputs.nuget-id }}
      nuget-sha256:
        value: ${{ jobs.check.outputs.nuget-sha256 }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.platform == 'macos' && 'macOS' || 'Windows x64' }}
    runs-on: ${{ inputs.platform == 'macos' && 'xcode-27' || 'windows-2025' }}
    timeout-minutes: ${{ inputs.platform == 'macos' && 45 || 60 }}
    outputs:
      windows-native-id: ${{ steps.windows-native.outputs.artifact-id }}
      nuget-id: ${{ steps.nuget.outputs.artifact-id }}
      nuget-sha256: ${{ steps.check.outputs.sha256 }}
    env:
      SDK_NAME: ${{ inputs.sdk }}
      SDK_REVISION: ${{ inputs.revision }}
      SDK_PLATFORM: ${{ inputs.platform }}
      DEVELOPER_DIR: ${{ inputs.platform == 'macos' && '/Applications/Xcode_27.2.app/Contents/Developer' || '' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      GIT_TERMINAL_PROMPT: "0"
    defaults:
      run:
        shell: bash
        working-directory: sdk
    steps:
      - name: Check out the dispatcher
        uses: actions/checkout@v6.1.0
        with:
          path: dispatcher
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.1"
          architecture: ${{ inputs.platform == 'macos' && 'arm64' || 'x64' }}
      - name: Check out the candidate SDK
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.revision }}
          path: sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the SDK's pinned tooling
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ inputs.tooling-revision }}
          path: sdk-tooling
          persist-credentials: false
      - name: Install mise
        if: inputs.platform == 'macos'
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          working_directory: dispatcher
          install: false
          cache: false
          add_shims_to_path: false
      - name: Install pinned .NET
        if: inputs.dotnet
        uses: actions/setup-dotnet@v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: sdk/global.json
          architecture: ${{ inputs.platform == 'macos' && 'arm64' || 'x64' }}
      - name: Require the accepted Windows native build
        if: inputs.combined-nuget && inputs.platform == 'macos'
        env:
          WINDOWS_NATIVE_ID: ${{ inputs.windows-native-id }}
        run: test -n "$WINDOWS_NATIVE_ID"
      - name: Download the accepted Windows native build
        if: inputs.combined-nuget && inputs.platform == 'macos'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.windows-native-id }}
          path: sdk/.native-build/windows/win-x64
      - name: Run SDK distribution checks
        id: check
        env:
          SDK_XCFRAMEWORK_OUTPUT: ${{ inputs.xcframeworks && format('{0}/sdk-xcframeworks', runner.temp) || '' }}
          SDK_NUGET_OUTPUT: ${{ inputs.combined-nuget && inputs.platform == 'macos' && format('{0}/sdk-nuget', runner.temp) || '' }}
        run: |
          options=()
          if [[ -n "$SDK_XCFRAMEWORK_OUTPUT" ]]; then
            options+=(--xcframework-output "$SDK_XCFRAMEWORK_OUTPUT")
          fi
          if [[ -n "$SDK_NUGET_OUTPUT" ]]; then
            options+=(--nuget-artifact "$SDK_NUGET_OUTPUT")
          fi
          python -I -B ../dispatcher/ci/check_distribution.py "$SDK_PLATFORM" "$SDK_NAME" "$SDK_REVISION" \
            --tooling ../sdk-tooling "${options[@]}"
      - name: Upload verified XCFramework archives
        if: inputs.xcframeworks
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.sdk }}-xcframeworks-${{ inputs.revision }}
          path: ${{ runner.temp }}/sdk-xcframeworks
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload the accepted Windows native build for NuGet
        if: inputs.combined-nuget && inputs.platform == 'windows'
        id: windows-native
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.sdk }}-nuget-windows-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-acceptance/sdk-windows/win-x64
          if-no-files-found: error
          retention-days: 7
      - name: Upload the macOS-tested NuGet package
        if: inputs.combined-nuget && inputs.platform == 'macos'
        id: nuget
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.sdk }}-nuget-${{ inputs.revision }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-nuget
          if-no-files-found: error
          retention-days: 7
