[settings]
activate_aggressive = true

[tools]
python = "3.15.1"
rust = "1.99.1"
actionlint = "1.7.12"
shellcheck = { version = "0.11.0", os = ["macos", "linux"] }
ruff = "0.17.3"
dprint = "0.64.3"
uv = { version = "0.13.6", os = ["macos", "linux"] }
"pypi:pyflakes" = { version = "4.1.0", os = ["macos", "linux"], depends = ["uv"] }

[tasks.check]
description = "Verify shared SDK mechanisms and contributor tooling"
depends = ["lint"]
run = [
  "python3 -B -m unittest discover -s tests",
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo test --locked --workspace",
]

[tasks.lint]
run = [
  "python3 -B -m sdk_tooling quality check --language python --language shell --language data",
  "cargo fmt --all -- --check",
]

[tasks.format]
run = [
  "python3 -B -m sdk_tooling quality format --language python --language shell --language data",
  "cargo fmt --all",
]
