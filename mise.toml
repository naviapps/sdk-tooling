[settings]
activate_aggressive = true

[tools]
python = "3.15.2"
rust = "1.100.0"
jactionlint = "2.6.0"
shellcheck = { version = "0.11.0", os = ["macos", "linux"] }
ruff = "0.17.6"
dprint = "0.65.0"
uv = { version = "0.13.10", os = ["macos", "linux"] }

[tasks.check]
description = "Verify shared SDK mechanisms and contributor tooling"
depends = ["lint"]
run = [
  "python3 -B -m unittest discover -s tests",
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "cargo test --locked --workspace",
]

[tasks.lint]
run = [
  "python3 -B -m sdk_tooling quality check --language python --language data",
  "cargo fmt --all -- --check",
]

[tasks.format]
run = [
  "python3 -B -m sdk_tooling quality format --language python --language data",
  "cargo fmt --all",
]

[tasks.clean]
description = "Remove local Rust build and Python bytecode outputs"
run = "python3 -B -m sdk_tooling clean target ci/__pycache__ sdk_tooling/__pycache__ sdk_tooling/consumers/__pycache__ tests/__pycache__"
