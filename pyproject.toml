[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sdk-tooling"
version = "0.1.0"
description = "Build and validation tools for native SDKs"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
sdk-tooling = "sdk_tooling.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ruff defaults, import hygiene and a mutable-default bug check.
select = ["E4", "E7", "E9", "F", "I", "RUF100", "B006"]
# Local callable binding is a style choice, not a correctness failure.
ignore = ["E731"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/sdk_tooling",
  "/ci/run_sdk_tooling.py",
  "/crates/cargo-consumer-identity/src/main.rs",
  "/crates/rustc-dep-info/src/main.rs",
]

[tool.hatch.build.targets.wheel]
packages = ["sdk_tooling"]

[tool.hatch.build.targets.wheel.force-include]
"crates/cargo-consumer-identity/src/main.rs" = "crates/cargo-consumer-identity/src/main.rs"
"crates/rustc-dep-info/src/main.rs" = "crates/rustc-dep-info/src/main.rs"
